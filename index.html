<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Задачи</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#7c6cf0">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Задачи</h1>
  <button id="testBtn" class="icon-btn" title="Проверить уведомление">&#128276;</button>
</header>

<div id="permBanner" class="perm-banner hidden">
  <span>Включите уведомления, чтобы не пропустить дело</span>
  <button id="permBtn">Включить</button>
</div>

<form id="addForm">
  <input id="taskInput" type="text" placeholder="Что нужно сделать?" required maxlength="120" autocomplete="off">
  <div class="row">
    <input id="dateInput" type="date" required>
    <input id="timeInput" type="time" required>
    <button type="submit" class="add-btn">Добавить</button>
  </div>
</form>

<main>
  <ul id="list"></ul>
  <p id="empty" class="empty hidden">Пока пусто — добавьте первую задачу</p>
</main>

<div id="alarm" class="alarm hidden">
  <div class="alarm-card">
    <div class="alarm-icon">&#9200;</div>
    <div id="alarmText" class="alarm-text"></div>
    <button id="alarmOk" class="alarm-ok">Понятно</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>

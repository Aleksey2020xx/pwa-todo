<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Заметки и задачи</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6d5b97">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>Сирень</h1>
  <button id="testNotifBtn" class="icon-btn" title="Тест уведомления">🔔</button>
</header>

<main>
  <!-- ===== ЗАДАЧИ ===== -->
  <section id="view-tasks" class="view active">
    <button class="big-add" id="addTaskBtn">+ Новая задача</button>
    <div id="tasksTagFilter" class="tag-filter"></div>
    <div id="taskForm" class="form hidden">
      <input type="text" id="taskText" class="field" placeholder="Что нужно сделать?" autocomplete="off">
      <div class="row">
        <input type="date" id="taskDate" class="field">
        <input type="time" id="taskTime" class="field">
      </div>
      <div id="taskTagPicker" class="tag-picker"></div>
      <button class="btn-primary" id="saveTaskBtn">Добавить</button>
    </div>
    <div id="tasksList"></div>
  </section>

  <!-- ===== ЗАМЕТКИ ===== -->
  <section id="view-notes" class="view">
    <button class="big-add" id="addNoteBtn">+ Новая заметка</button>
    <div id="notesTagFilter" class="tag-filter"></div>
    <div id="noteForm" class="form hidden">
      <textarea id="noteText" class="field note-area" placeholder="Текст заметки…" rows="1"></textarea>
      <div id="noteTagPicker" class="tag-picker"></div>
      <button class="btn-primary" id="saveNoteBtn">Добавить</button>
    </div>
    <div id="notesList"></div>
  </section>

  <!-- ===== СПИСКИ (ТЕГИ) ===== -->
  <section id="view-tags" class="view">
    <p class="hint">Нажмите на заголовок записи, чтобы открыть её целиком в своём разделе.</p>
    <div id="tagsAccordion"></div>
  </section>
</main>

<!-- Назойливый баннер -->
<div id="banner" class="banner hidden">
  <div class="banner-title">⏰ Пора делать!</div>
  <div id="bannerText" class="banner-text"></div>
  <button class="btn-primary" id="bannerOk">Понятно</button>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="tasks">✓<span>Задачи</span></button>
  <button class="nav-btn" data-view="notes">✎<span>Заметки</span></button>
  <button class="nav-btn nav-square" data-view="tags" title="Списки">☰</button>
</nav>

<script src="app.js"></script>
</body>
</html>

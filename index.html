<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#7c5cff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Мои дела</title>
<link rel="stylesheet" href="./style.css">
</head>
<body>
<header>
  <h1>Мои дела</h1>
  <button id="bell" class="icon-btn" title="Тестовое уведомление">🔔</button>
</header>

<main>
  <section id="view-tasks" class="view active">
    <button id="add-task-btn" class="primary-btn wide">+ Новая задача</button>
    <form id="task-form" class="card form hidden">
      <input id="task-text" type="text" placeholder="Что нужно сделать?" required>
      <div class="row">
        <input id="task-date" type="date" required>
        <input id="task-time" type="time" required>
      </div>
      <button type="submit" class="primary-btn">Добавить</button>
    </form>
    <ul id="task-list" class="list"></ul>
  </section>

  <section id="view-notes" class="view">
    <button id="add-note-btn" class="primary-btn wide">+ Новая заметка</button>
    <form id="note-form" class="card form hidden">
      <textarea id="note-text" rows="1" placeholder="Текст заметки…" required></textarea>
      <div id="tag-suggest" class="chips-row hidden"></div>
      <input id="tag-input" type="text" placeholder="Тег (Enter — добавить)">
      <div id="tag-chips" class="chips-row"></div>
      <button type="submit" class="primary-btn">Сохранить</button>
    </form>
    <ul id="note-list" class="list"></ul>
  </section>
</main>

<nav class="bottom-nav">
  <button data-view="tasks" class="nav-btn active">📋<span>Задачи</span></button>
  <button data-view="notes" class="nav-btn">📝<span>Заметки</span></button>
</nav>

<div id="banner" class="banner hidden">
  <div class="banner-card">
    <div class="banner-title">⏰ Пора!</div>
    <div id="banner-text" class="banner-text"></div>
    <button id="banner-ok" class="primary-btn">Понятно</button>
  </div>
</div>

<div id="toast"></div>
<script src="./app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Заметки">
  <meta name="theme-color" content="#9b7ede">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">
  <title>Заметки</title>
</head>
<body>
  <div class="app">
    <header class="header">
      <h1>Заметки</h1>
      <button id="notifyBtn" class="btn-icon" title="Разрешить уведомления">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
        </svg>
      </button>
    </header>

    <main class="content">
      <form id="taskForm" class="form">
        <input type="text" id="taskInput" class="input" placeholder="Что нужно сделать?" maxlength="200" required>
        <div class="row">
          <input type="date" id="dateInput" class="input" required>
          <input type="time" id="timeInput" class="input" required>
        </div>
        <button type="submit" class="btn-primary">Добавить</button>
      </form>

      <div id="taskList" class="task-list"></div>
      <div id="emptyState" class="empty-state">
        <p>Пока пусто — добавьте первую заметку ✨</p>
      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#8b7bd8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Заметки и задачи</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="header">
  <h1 id="view-title">Задачи</h1>
  <button id="test-notif" class="icon-btn" title="Тестовое уведомление">&#128276;</button>
</header>
<main id="app"></main>

<nav class="bottom-nav">
  <button class="nav-btn active" data-view="tasks">
    <span class="nav-ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 12.5 9.5 18 20 6.5"/></svg>
    </span>
    <span>Задачи</span>
  </button>
  <button class="nav-btn" data-view="notes">
    <span class="nav-ico">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
    </span>
    <span>Заметки</span>
  </button>
  <button class="nav-btn square" data-view="tags" aria-label="Теги">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="16" y2="12"/><line x1="4" y1="18" x2="12" y2="18"/></svg>
  </button>
</nav>

<div id="banner" class="overlay hidden">
  <div class="banner-card">
    <div class="banner-ico">&#9200;</div>
    <div id="banner-meta" class="banner-meta"></div>
    <div id="banner-text" class="banner-text"></div>
    <button class="btn btn-primary" id="banner-ok">Понятно</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
